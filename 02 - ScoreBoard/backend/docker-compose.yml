services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoreboard
      POSTGRES_PASSWORD: scoreboard
      POSTGRES_DB: scoreboard
    ports:
      - "5433:5432"
    volumes:
      - scoreboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreboard -d scoreboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://scoreboard:scoreboard@db:5432/scoreboard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  scoreboard-db-data:
