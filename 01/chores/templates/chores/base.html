<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Chore Tracker{% endblock %}</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1rem;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #ccc;
        }
        nav a { text-decoration: none; font-weight: 600; }
        nav a:hover { text-decoration: underline; }
        nav .brand { margin-right: auto; }
        main { max-width: 720px; margin: 0 auto; padding: 1rem; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
        form { margin: 0.5rem 0; }
        input, select, button { font-size: 1rem; padding: 0.4rem 0.6rem; }
        button { cursor: pointer; }
        ul.messages { list-style: none; padding: 0; }
        ul.messages li {
            border: 1px solid #e0b800;
            background: #fff8db;
            color: #1a1a1a;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="{% url 'chores:home' %}">Current Week</a>
        <a href="{% url 'chores:plan' %}">Weekly Planning</a>
        <a href="{% url 'chores:history' %}">History</a>
        {% if current_person %}
            <span>Logged in as {{ current_person.name }}</span>
            <a href="{% url 'chores:logout' %}">Switch person</a>
        {% else %}
            <a href="{% url 'chores:login' %}">Log in</a>
        {% endif %}
    </nav>

    <main>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
